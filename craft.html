<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1A1E2A">
    <title>LootStar — Крафт</title>
    <link rel="stylesheet" href="/craft.css">
    <!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Общие модули -->
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="gifts.js"></script>
<script src="firebase.js"></script>

<!-- Локальный скрипт -->
<script src="index.js" defer></script>
</head>
<body>

    <header>
        <div class="logo">
            <img src="../logo.png" alt="LootStar">
            <h1>LootStar</h1>
        </div>
        <div class="user-info">
            <div class="user-balance">
                <img src="star.png" alt="star">
                <p id="balanceDisplay">0</p>
            </div>
            <div class="user-profile" onclick="location.href='profile.html'">
                <img src="star.png" alt="user">
                <p id="userName">Username</p>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="cases-title">КРАФТ</div>

        <div class="craft-info" id="craftInfo">Выберите от 3 до 9 предметов для крафта</div>

        <div class="craft-slots" id="craftSlots"></div>

        <div class="bet-panel">
            <button class="place-btn" id="craftBtn" onclick="onCraft()" disabled>Выберите предметы</button>
        </div>
    </main>

    <!-- Модалка выбора предмета -->
    <div class="modal-overlay" id="selectModal">
        <div class="modal">
            <div class="modal-scroll">
                <div class="modal-handle"></div>
                <div class="modal-hdr">
                    <div class="modal-name">Выберите предмет</div>
                    <button class="modal-close-btn" onclick="closeSelector()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="inv-select-grid" id="selectGrid"></div>
            </div>
        </div>
    </div>

    <!-- Модалка результата -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-box" id="resultBox">
            <div class="result-mult" id="resultMult">x1.00</div>
            <div class="result-detail" id="resultDetail">Крафт завершён</div>
            <img class="result-gift-img" id="resultImg" src="star.png" alt="">
            <div class="result-gift-name" id="resultName">Подарок</div>
            <div class="result-balance" id="resultBalance">
                <img src="star.png" alt=""> + 0
            </div>
            <button class="result-close-btn" onclick="closeResult()">ОК</button>
        </div>
    </div>

    <nav class="bnav">
        <button data-page="games" class="active" onclick="location.href='games.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="3"></rect>
                <line x1="6" y1="12" x2="10" y2="12"></line>
                <line x1="8" y1="10" x2="8" y2="14"></line>
                <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"></circle>
                <circle cx="18" cy="12" r="1" fill="currentColor" stroke="none"></circle>
            </svg>
            <span>Игры</span>
        </button>
        <button data-page="cases" onclick="location.href='index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
            </svg>
            <span>Кейсы</span>
        </button>
        <button data-page="upgrades" onclick="location.href='upgrades.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5"></path>
                <path d="M5 12l7-7 7 7"></path>
            </svg>
            <span>Апгрейд</span>
        </button>
        <button data-page="profile" onclick="location.href='profile.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Профиль</span>
        </button>
    </nav>

    <div class="toast" id="toast"></div>
    <script src="/craft.js"></script>
</body>
</html>
