<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=480, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1A1E2A">
    <title>LootStar — Краш</title>
    <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Общие модули -->
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="gifts.js"></script>
<script src="firebase.js"></script>

<!-- Локальный скрипт -->
<script src="index.js" defer></script>
    <link rel="stylesheet" href="/crash.css">
</head>
<body>

    <div class="app">
        <header>
            <div class="logo">
                <img src="../logo.png" alt="LootStar">
                <h1>LootStar</h1>
            </div>
            <div class="user-info">
                <div class="user-balance">
                    <img src="star.png" alt="star">
                    <p id="balanceDisplay">0</p>
                </div>
                <div class="user-profile" onclick="location.href='profile.html'">
                    <img src="star.png" alt="user">
                    <p id="userName">Username</p>
                </div>
            </div>
        </header>

        <div class="view">
            <div class="history-wrap">
                <div class="history-track" id="historyTrack"></div>
            </div>

            <div class="game-area">
                <div class="stars-parallax"><div class="stars" id="starsField"></div></div>
                <div class="status-label" id="statusLabel">Ожидание раунда</div>
                <div class="lottie-container">
                    <lottie-player id="waitLottie" src="https://cdn.changes.tg/gifts/models/Stellar%20Rocket/lottie/First%20Step.json" background="transparent" speed="1" loop></lottie-player>
                    <lottie-player id="roundLottie" src="https://cdn.changes.tg/gifts/models/Stellar%20Rocket/lottie/To%20The%20Moon.json" background="transparent" speed="1" loop></lottie-player>
                    <lottie-player id="crashLottie" src="https://cdn.changes.tg/gifts/models/Stellar%20Rocket/lottie/Fireworks.json" background="transparent" speed="1"></lottie-player>
                </div>
                <div class="timer-number" id="timerNumber">7</div>
                <div class="current-multiplier" id="currentMult" style="display:none;">x1.00</div>
            </div>

            <div class="bets-panel">
                <div class="bets-title"><span>Ставка</span><span>Возможн. приз</span></div>
                <div id="betsList"></div>
            </div>

            <div class="controls">
                <div class="amount-row">
                    <input id="betAmount" type="number" value="50" min="25" step="25">
                    <button onclick="setBet(25)">25</button>
                    <button onclick="setBet(50)">50</button>
                    <button onclick="setBet(100)">100</button>
                    <button onclick="setBet(250)">250</button>
                    <button onclick="setBetMax()">MAX</button>
                </div>
                <button class="place-btn" id="mainBtn" onclick="onMainBtn()">Сделать ставку</button>
            </div>
        </div>

        <nav class="bnav">
            <button data-page="games" class="active" onclick="location.href='games.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="12" rx="3"></rect>
                    <line x1="6" y1="12" x2="10" y2="12"></line>
                    <line x1="8" y1="10" x2="8" y2="14"></line>
                    <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"></circle>
                    <circle cx="18" cy="12" r="1" fill="currentColor" stroke="none"></circle>
                </svg>
                <span>Игры</span>
            </button>
            <button data-page="cases" onclick="location.href='index.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                </svg>
                <span>Кейсы</span>
            </button>
            <button data-page="upgrades" onclick="location.href='upgrades.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path>
                </svg>
                <span>Апгрейд</span>
            </button>
            <button data-page="profile" onclick="location.href='profile.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/crash.js"></script>
</body>
</html>
