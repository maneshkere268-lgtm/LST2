<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1A1E2A">
    <title>LootStar — Игры</title>
    <link rel="stylesheet" href="/games.css">
    <!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Общие модули -->
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="gifts.js"></script>
<script src="firebase.js"></script>

<!-- Локальный скрипт -->
<script src="index.js" defer></script>
</head>
<body>

    <header>
        <div class="logo">
            <img src="../logo.png" alt="LootStar">
            <h1>LootStar</h1>
        </div>
        <div class="user-info">
            <div class="user-balance">
                <img src="star.png" alt="star">
                <p id="balanceDisplay">0</p>
            </div>
            <div class="user-profile" onclick="location.href='profile.html'">
                <img src="star.png" alt="user">
                <p id="userName">Username</p>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="cases-title">ИГРЫ</div>
        <div class="games-grid">

            <div class="game-card" onclick="location.href='mines.html'">
                <div class="game-icon mines">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="14" r="6"></circle>
                        <line x1="12" y1="2" x2="12" y2="8"></line>
                        <line x1="5" y1="6" x2="9" y2="10"></line>
                        <line x1="19" y1="6" x2="15" y2="10"></line>
                    </svg>
                </div>
                <div class="game-name">Мины</div>
                <div class="game-desc">Открывай безопасные клетки</div>
            </div>

            <div class="game-card" onclick="location.href='crash.html'">
                <div class="game-icon crash">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
                        <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
                    </svg>
                </div>
                <div class="game-name">Краш</div>
                <div class="game-desc">Успей вывести до краха</div>
            </div>

            <div class="game-card" onclick="location.href='craft.html'">
                <div class="game-icon craft">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                </div>
                <div class="game-name">Крафт</div>
                <div class="game-desc">Объединяй предметы</div>
            </div>

        </div>
    </main>

    <nav class="bnav">
        <button data-page="games" class="active" onclick="location.href='games.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="3"></rect>
                <line x1="6" y1="12" x2="10" y2="12"></line>
                <line x1="8" y1="10" x2="8" y2="14"></line>
                <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"></circle>
                <circle cx="18" cy="12" r="1" fill="currentColor" stroke="none"></circle>
            </svg>
            <span>Игры</span>
        </button>
        <button data-page="cases" onclick="location.href='index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
            </svg>
            <span>Кейсы</span>
        </button>
        <button data-page="upgrades" onclick="location.href='upgrades.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5"></path>
                <path d="M5 12l7-7 7 7"></path>
            </svg>
            <span>Апгрейд</span>
        </button>
        <button data-page="profile" onclick="location.href='profile.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Профиль</span>
        </button>
    </nav>

    <script src="/games.js"></script>
</body>
</html>
