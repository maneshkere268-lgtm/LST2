<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1A1E2A">
    <title>LootStar — Профиль</title>
    <link rel="stylesheet" href="/profile.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="../logo.png" alt="LootStar">
            <h1>LootStar</h1>
        </div>
        <div class="user-info">
            <div class="user-balance">
                <img src="star.png" alt="star">
                <p id="balanceDisplay">0</p>
            </div>
        </div>
    </header>

    <main class="main">

        <section class="profile-section">
            <div class="avatar-wrap">
                <div class="profile-avatar" id="profileAvatar">U</div>
            </div>
            <div class="profile-name" id="profileName">Username</div>
            <div class="profile-uid" id="profileId">ID: guest</div>

            <div class="profile-stats">
                <div class="profile-stat">
                    <div class="profile-stat-val" id="statBalance">0</div>
                    <div class="profile-stat-label">Баланс</div>
                </div>
                <div class="profile-stat">
                    <div class="profile-stat-val" id="statGifts">0</div>
                    <div class="profile-stat-label">Предметов</div>
                </div>
                <div class="profile-stat">
                    <div class="profile-stat-val" id="statValue">0</div>
                    <div class="profile-stat-label">Стоимость</div>
                </div>
            </div>
        </section>

        <div class="section-header">
            <div class="section-title">ИНВЕНТАРЬ</div>
            <button class="btn-sell-all" onclick="openSellAllModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                Продать всё
            </button>
        </div>

        <div id="inventoryContainer"></div>

    </main>

    <div class="modal-overlay" id="itemModal">
        <div class="modal">
            <div class="modal-scroll">
                <div class="modal-handle"></div>
                <div class="item-preview">
                    <img id="itemModalImg" src="star.png" alt="">
                </div>
                <div class="item-name" id="itemModalName">—</div>
                <div class="item-price" id="itemModalPrice">
                    <img src="star.png" alt="">
                    <span>0</span>
                </div>
                <div class="item-btns">
                    <button class="item-btn item-btn-sell" onclick="sellItem()">Продать</button>
                    <button class="item-btn item-btn-upgrade" onclick="upgradeItem()">Улучшить</button>
                </div>
                <button class="item-btn-close" onclick="closeItemModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="sellAllModal">
        <div class="modal">
            <div class="modal-scroll">
                <div class="modal-handle"></div>
                <div class="confirm-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 8v5"></path>
                        <circle cx="12" cy="16" r="0.5" fill="currentColor"></circle>
                    </svg>
                </div>
                <div class="confirm-title">Продать всё?</div>
                <div class="confirm-text">Вы получите <span id="sellAllValue">0</span> звёзд за все предметы</div>
                <div class="confirm-btns">
                    <button class="confirm-btn confirm-btn-cancel" onclick="closeSellAllModal()">Отмена</button>
                    <button class="confirm-btn confirm-btn-ok" onclick="confirmSellAll()">Продать</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bnav">
        <button data-page="cases" onclick="location.href='index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
            <span>Кейсы</span>
        </button>
        <button data-page="profile" class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Профиль</span>
        </button>
        <button data-page="upgrades" onclick="location.href='upgrades.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
            <span>Апгрейд</span>
        </button>
        <button data-page="crash" onclick="location.href='crash.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path></svg>
            <span>Краш</span>
        </button>
    </nav>

    <div class="toast" id="toast"></div>
    <script src="/profile.js"></script>
</body>
</html>
