<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1A1E2A">
    <title>LootStar — Апгрейд</title>
    <link rel="stylesheet" href="/upgrades.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
</head>
<body>

    <header>
        <div class="logo">
            <img src="../logo.png" alt="LootStar">
            <h1>LootStar</h1>
        </div>
        <div class="user-info">
            <div class="user-balance">
                <img src="star.png" alt="star">
                <p id="balanceDisplay">0</p>
            </div>
            <div class="user-profile" onclick="location.href='profile.html'">
                <img src="star.png" alt="user">
                <p id="userName">Username</p>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="cases-title">АПГРЕЙД</div>

        <div class="wheel-section">
            <div class="wheel-container">
                <div class="wheel-glow" id="wheelGlow"></div>

                <svg class="wheel-bg" viewBox="0 0 220 220">
                    <circle cx="110" cy="110" r="105" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="8"/>
                </svg>

                <svg class="wheel-arc" id="greenArc" viewBox="0 0 220 220">
                    <defs>
                        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#F5C518"/>
                            <stop offset="100%" stop-color="#FFE066"/>
                        </linearGradient>
                    </defs>
                    <path id="greenPath" d="" fill="none" stroke="url(#greenGrad)" stroke-width="8" stroke-linecap="round"/>
                </svg>

                <div class="wheel-pointer-wrap" id="pointerWrap">
                    <div class="wheel-pointer"></div>
                </div>

                <div class="wheel-center" id="wheelCenter">
                    <img id="wheelCenterImg" src="star.png" alt="">
                    <span class="chance-pct" id="chancePct">0%</span>
                    <svg class="wheel-result-icon" id="resultSad" viewBox="0 0 60 60">
                        <circle cx="30" cy="30" r="28" fill="none" stroke="#ef4444" stroke-width="2"/>
                        <circle cx="20" cy="24" r="2.5" fill="#ef4444"/>
                        <circle cx="40" cy="24" r="2.5" fill="#ef4444"/>
                        <path d="M20 42c4-6 16-6 20 0" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <svg class="wheel-result-icon" id="resultHappy" viewBox="0 0 60 60">
                        <circle cx="30" cy="30" r="28" fill="none" stroke="#F5C518" stroke-width="2"/>
                        <circle cx="20" cy="24" r="2.5" fill="#F5C518"/>
                        <circle cx="40" cy="24" r="2.5" fill="#F5C518"/>
                        <path d="M20 38c4 6 16 6 20 0" fill="none" stroke="#F5C518" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </div>

        <button class="upgrade-btn" id="upgradeBtn" disabled onclick="doUpgrade()">
            <span id="upgradeBtnText">Апгрейд</span>
        </button>

        <div class="cards-row">
            <div class="card" id="leftCard" onclick="toggleInventory()">
                <div class="card-placeholder">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
                        </svg>
                    </div>
                    <div class="card-text">Выберите ваш<br>подарок</div>
                </div>
                <div class="gift-preview">
                    <img id="leftGiftImg" src="star.png" alt="">
                    <div class="gift-preview-name" id="leftGiftName"></div>
                    <div class="gift-preview-value">
                        <img src="star.png" alt="">
                        <span id="leftGiftValue"></span>
                    </div>
                </div>
            </div>

            <div class="card" id="rightCard" onclick="toggleTargets()">
                <div class="card-placeholder">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
                        </svg>
                    </div>
                    <div class="card-text">Выберите желаемый<br>подарок</div>
                </div>
                <div class="gift-preview">
                    <img id="rightGiftImg" src="star.png" alt="">
                    <div class="gift-preview-name" id="rightGiftName"></div>
                    <div class="gift-preview-value">
                        <img src="star.png" alt="">
                        <span id="rightGiftValue"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="btns-row">
            <button class="select-btn" id="btnInventory" onclick="toggleInventory()">Инвентарь</button>
            <button class="select-btn" id="btnTargets" onclick="toggleTargets()">Желаемый</button>
        </div>

        <div class="inline-section" id="inventorySection">
            <div class="section-title">Ваш инвентарь</div>
            <div class="inline-grid" id="inventoryGrid">
                <div class="empty-msg" style="grid-column:1/-1">Загрузка...</div>
            </div>
        </div>

        <div class="inline-section" id="targetsSection">
            <div class="section-title">Желаемые подарки</div>
            <div class="target-list-inline" id="targetsList"></div>
        </div>
    </main>

    <nav class="bnav">
        <button data-page="games" onclick="location.href='games.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="3"></rect>
                <line x1="6" y1="12" x2="10" y2="12"></line>
                <line x1="8" y1="10" x2="8" y2="14"></line>
                <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"></circle>
                <circle cx="18" cy="12" r="1" fill="currentColor" stroke="none"></circle>
            </svg>
            <span>Игры</span>
        </button>
        <button data-page="cases" onclick="location.href='index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
            </svg>
            <span>Кейсы</span>
        </button>
        <button data-page="upgrades" class="active" onclick="location.href='upgrades.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5"></path>
                <path d="M5 12l7-7 7 7"></path>
            </svg>
            <span>Апгрейд</span>
        </button>
        <button data-page="profile" onclick="location.href='profile.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Профиль</span>
        </button>
    </nav>

    <div class="toast" id="toast"></div>
    <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

    <script src="/upgrades.js"></script>
</body>
</html>
